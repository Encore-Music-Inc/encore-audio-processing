name: CI

# Pull requests run once (pull_request); main and v* tags run on push.
#
#   pull request, main,   the test suites on Linux x64, Windows x64 and macOS
#   manual                (Apple Silicon), in parallel, and master.wasm
#   weekly (schedule), or the same, plus the suites built with AddressSanitizer and
#   manual with checks:   UndefinedBehaviorSanitizer on Linux x64
#   weekly
#   v* tag                no rebuild: master.wasm from the main build of that commit
#                         is attached to the Release
#
# Docs-only changes, and pull requests that only change the version and
# CHANGELOG.md, skip the heavy jobs (see the changes job).
#
# Every action is pinned to a commit (the version is in the comment next to it);
# Dependabot proposes updates (.github/dependabot.yml).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
    inputs:
      checks:
        description: 'build: tests and master.wasm, as on main. weekly: also the sanitizers'
        type: choice
        options: [build, weekly]
        default: build

permissions:
  contents: read

# A newer push to the same pull request cancels the older run. Runs on main are
# never cancelled: every main commit keeps its build, so it can be released.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Emscripten version master.wasm is built with. Changing it can change
  # the bytes of master.wasm, so bump it on purpose and check Green Room.
  EMSCRIPTEN_VERSION: 6.0.13
  SCCACHE_VERSION: v0.10.0
  SCCACHE_SHA256: 6d8823b5c13e0dba776d88c537229256ecb2f01a1d775b507fd141cb55d30578

jobs:
  # Decides whether the heavy jobs need to run. A pull request or push that only
  # touches docs (*.md, LICENSE, .github/CODEOWNERS) skips them; skipped jobs count
  # as passing, so docs-only pull requests stay mergeable when checks are required.
  # So does a pull request that only changes the version line in
  # tests/CMakeLists.txt and CHANGELOG.md (a "Release vX.Y.Z" pull request): its
  # release notes are still checked, and the push to main after merging builds and
  # tests everything, which is the build a release is made from.
  # Tags, manual and weekly runs always run what they need.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
      kind: ${{ steps.diff.outputs.kind }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          CHECKS: ${{ inputs.checks }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # kind: pr or build (tests and master.wasm), weekly (also the sanitizers),
          # release (no build: attach main's master.wasm)
          if [[ "$REF" == refs/tags/v* ]]; then kind=release
          elif [[ "$EVENT" == "pull_request" ]]; then kind=pr
          elif [[ "$EVENT" == "schedule" || "$CHECKS" == "weekly" ]]; then kind=weekly
          else kind=build; fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" == "pull_request" ]]; then
            files=$(git diff --name-only "$PR_BASE" "$PR_HEAD")
          elif [[ "$EVENT" == "push" && "$REF" == refs/heads/* && -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            files=$(git diff --name-only "$PUSH_BEFORE" "$SHA")
          else
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "Tag, manual or weekly run: everything it needs runs"; exit 0
          fi
          echo "Changed files:"; echo "$files"
          code=$(echo "$files" | grep -Ev '(\.md$|^LICENSE$|^\.github/CODEOWNERS$)' | grep -c . || true)
          # A pull request that changes only the version line and CHANGELOG.md
          version_file=tests/CMakeLists.txt
          if [[ "$EVENT" == "pull_request" && "$code" -gt 0 ]] \
             && [[ "$(echo "$files" | grep -Ev '(\.md$|^LICENSE$|^\.github/CODEOWNERS$)')" == "$version_file" ]]; then
            other=$(git diff -U0 "$PR_BASE" "$PR_HEAD" -- "$version_file" | grep -E '^[-+]' | grep -Ev '^(\+\+\+|---) ' \
                    | grep -Ev '^[-+]project\(EncoreAudioProcessingTests VERSION [0-9]+\.[0-9]+\.[0-9]+' | grep -c . || true)
            if [[ "$other" -eq 0 ]]; then
              echo "code=false" >> "$GITHUB_OUTPUT"
              echo "Version only: the release notes are checked; tests and master.wasm run on main after merging"
              exit 0
            fi
          fi
          if [[ "$code" -gt 0 ]]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; echo "Docs only: tests and master.wasm are skipped"; fi

      - id: version
        name: Version (from tests/CMakeLists.txt; a tag must match it)
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^project\(EncoreAudioProcessingTests VERSION ([0-9.]+).*/\1/p' tests/CMakeLists.txt)
          test -n "$version" || { echo "::error::No version found in tests/CMakeLists.txt"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"
          if [[ "$REF" == refs/tags/v* && "v$version" != "$REF_NAME" ]]; then
            echo "::error::Tag $REF_NAME does not match the version in tests/CMakeLists.txt ($version). Change project(EncoreAudioProcessingTests VERSION ...) on main first."
            exit 1
          fi

      # Every version has its release notes in CHANGELOG.md, so the "Release
      # vX.Y.Z" pull request can't merge without them. The release job puts
      # them on the GitHub release.
      - name: Release notes for this version (CHANGELOG.md)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/release-notes.sh "$VERSION"
  # The products build these headers with GCC or Clang on Linux, MSVC on Windows
  # and Apple Clang on macOS, so the suites run on all three.
  tests:
    name: Tests
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.kind != 'release'
    # A fixed name: GitHub adds the matrix value ("Tests (Windows)"), and a skipped
    # run shows plain "Tests" instead of an unfilled ${{ }} template
    strategy:
      fail-fast: false
      matrix:
        os: [Linux, Windows, macOS]
    runs-on: ${{ matrix.os == 'Windows' && 'windows-2022' || matrix.os == 'macOS' && 'macos-15' || 'ubuntu-24.04' }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 1G
      SCCACHE_DIR: ${{ github.workspace }}/.ccache
      SCCACHE_CACHE_SIZE: 1G
    steps:
      # The JUCE submodule only (depth 1); it has no submodules of its own
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1
          persist-credentials: false
      - name: Install Ninja, ccache and JUCE's build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build ccache libfreetype-dev libfontconfig1-dev
      - name: Install Ninja and ccache (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache
      - name: MSVC environment (Windows, for Ninja)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Install sccache ${{ env.SCCACHE_VERSION }} (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "sccache-$env:SCCACHE_VERSION-x86_64-pc-windows-msvc"
          Invoke-WebRequest "https://github.com/mozilla/sccache/releases/download/$env:SCCACHE_VERSION/$name.zip" -OutFile "$env:RUNNER_TEMP\sccache.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP\sccache.zip" -Algorithm SHA256).Hash -ne $env:SCCACHE_SHA256) { throw "sccache download does not match its SHA-256" }
          Expand-Archive "$env:RUNNER_TEMP\sccache.zip" -DestinationPath "$env:RUNNER_TEMP"
          "$env:RUNNER_TEMP\$name" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Cache key
        id: key
        shell: bash
        run: |
          echo "juce=$(git rev-parse HEAD:external/JUCE)" >> "$GITHUB_OUTPUT"
          case "$RUNNER_OS" in
            Linux) echo "compiler=gcc-$(gcc -dumpfullversion)" ;;
            macOS) echo "compiler=xcode-$(xcodebuild -version | head -n 1 | tr -cd '0-9.')" ;;
            Windows) echo "compiler=msvc-$VCToolsVersion" ;;
          esac >> "$GITHUB_OUTPUT"
          [[ "$RUNNER_OS" == Windows ]] && echo "launcher=sccache" >> "$GITHUB_OUTPUT" || echo "launcher=ccache" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: cache-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.compiler }}-juce-${{ steps.key.outputs.juce }}-${{ github.run_id }}
          restore-keys: cache-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.compiler }}-juce-${{ steps.key.outputs.juce }}-
      # Windows: embedded debug info (/Z7) so sccache can cache every object
      # Default shells: bash on Linux and macOS, PowerShell on Windows (which keeps
      # MSVC's link.exe ahead of Git Bash's)
      - name: Configure
        run: >
          cmake -S tests -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=${{ steps.key.outputs.launcher }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ steps.key.outputs.launcher }}
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
      - name: Build
        run: cmake --build build --parallel
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.key.outputs.juce != ''
        with:
          path: .ccache
          key: cache-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.compiler }}-juce-${{ steps.key.outputs.juce }}-${{ github.run_id }}
      - name: Run
        run: ctest --test-dir build --output-on-failure --parallel 4

  # Weekly: the suites built with AddressSanitizer and UndefinedBehaviorSanitizer,
  # which catch memory errors and undefined behaviour (the kind of bug that
  # crashes a DAW) that plain tests miss. Two to three times slower, so weekly.
  #
  # Undefined behaviour is reported and the tests carry on, so one run lists
  # every finding; the job then fails if there were any. A memory error stops
  # at once (after one, memory may be corrupt and later results can't be
  # trusted). Exceptions: .github/sanitizers/ubsan.supp, each with its reason.
  sanitizers:
    name: Sanitizers (Linux x64)
    needs: changes
    if: needs.changes.outputs.kind == 'weekly'
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 1G
      # Leak checking is off: fontconfig keeps memory until exit by design
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:strict_string_checks=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1
          persist-credentials: false
      - name: Install Ninja, ccache and JUCE's build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build ccache libfreetype-dev libfontconfig1-dev
      - name: Cache key
        id: key
        run: |
          echo "juce=$(git rev-parse HEAD:external/JUCE)" >> "$GITHUB_OUTPUT"
          echo "compiler=gcc-$(gcc -dumpfullversion)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: cache-sanitizers-${{ steps.key.outputs.compiler }}-juce-${{ steps.key.outputs.juce }}-${{ github.run_id }}
          restore-keys: cache-sanitizers-${{ steps.key.outputs.compiler }}-juce-${{ steps.key.outputs.juce }}-
      - name: Configure
        run: >
          cmake -S tests -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel "$(nproc)"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.key.outputs.juce != ''
        with:
          path: .ccache
          key: cache-sanitizers-${{ steps.key.outputs.compiler }}-juce-${{ steps.key.outputs.juce }}-${{ github.run_id }}
      - name: Run
        run: |
          reports="$RUNNER_TEMP/ubsan"
          mkdir -p "$reports"
          export UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=0:report_error_type=1:suppressions=$GITHUB_WORKSPACE/.github/sanitizers/ubsan.supp:log_path=$reports/report"
          code=0
          ctest --test-dir build --output-on-failure --parallel 4 || code=$?
          bash .github/sanitizers/report.sh "$reports" "$code"

  wasm:
    name: master.wasm
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.kind != 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Emscripten ${{ env.EMSCRIPTEN_VERSION }}
        run: |
          git clone --depth 1 --branch "$EMSCRIPTEN_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSCRIPTEN_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSCRIPTEN_VERSION"
      - name: Build
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          em++ --version | head -n 1
          wasm/build.sh
          (cd wasm && sha256sum master.wasm > master.wasm.sha256)
          cat wasm/master.wasm.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: master.wasm
          path: |
            wasm/master.wasm
            wasm/master.wasm.sha256
          if-no-files-found: error

  # Every pin is a published release (or a listed exception): the README's
  # Pinned releases table against what each folder is pinned to. Runs on every
  # pull request and push, docs-only ones too: it reads the README.
  pins:
    name: Pinned releases
    needs: changes
    if: needs.changes.outputs.kind != 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the pins
        run: bash .github/pins/check.sh

  # The one check to require on main. It fails if any build or test job failed or
  # was cancelled, and passes when they passed or were skipped (docs-only changes).
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, pins, tests, sanitizers, wasm]
    runs-on: ubuntu-24.04
    steps:
      - name: Check the build and test jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            if [[ "$r" == failure || "$r" == cancelled ]]; then echo "::error::A build or test job did not pass"; exit 1; fi
          done

  release:
    name: Release (files from the main build)
    needs: changes
    if: needs.changes.outputs.kind == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Find the main build of this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&head_sha=$SHA&status=success&per_page=50" \
                 --jq '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch") | .id')
          for id in $runs; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100" \
                 --jq '.artifacts[] | select(.expired == false) | .name' | grep -qx master.wasm; then
              echo "run=$id" >> "$GITHUB_OUTPUT"; echo "Using run $id"; exit 0
            fi
          done
          echo "::error::No successful main build with master.wasm for $TAG ($SHA). Releases are not rebuilt. Wait for the main build of this commit to finish (or, if that push only changed docs and skipped the build, run CI by hand on main: Actions, CI, Run workflow), then re-run this job."
          exit 1
      - name: Download its files
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ steps.find.outputs.run }}
        run: gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n master.wasm -D files
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          sparse-checkout: |
            CHANGELOG.md
            .github/release-notes.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Attach them to the release, with its title and notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          set -euo pipefail
          # Title and notes come from the repository (CHANGELOG.md), whatever
          # was typed when the release was published.
          title="ENCORE. Audio Processing $TAG"
          (cd src && .github/release-notes.sh "$VERSION") > notes.md
          cd files
          ls -l
          sha256sum -c master.wasm.sha256
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" master.wasm master.wasm.sha256 --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "$title" --notes-file ../notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" master.wasm master.wasm.sha256 --verify-tag --title "$title" \
              --notes-file ../notes.md --repo "$GITHUB_REPOSITORY"
          fi
