name: CI

# Pull requests run once (pull_request); main and v* tags run on push.
# Docs-only changes skip the heavy jobs (see the changes job).
# A v* tag doesn't rebuild: it attaches master.wasm from the main build of that commit.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # The Emscripten version master.wasm is built with. Changing it can change
  # the bytes of master.wasm, so bump it on purpose and check Green Room.
  EMSCRIPTEN_VERSION: 6.0.13

jobs:
  # Decides whether the heavy jobs need to run. A pull request or push that only
  # touches docs (*.md, LICENSE, .github/CODEOWNERS) skips them; skipped jobs count
  # as passing, so docs-only pull requests stay mergeable when checks are required.
  # Tags and manual runs always run everything.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
      kind: ${{ steps.diff.outputs.kind }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # kind: pr or build (tests and master.wasm), release (no build: attach main's master.wasm)
          if [[ "$REF" == refs/tags/v* ]]; then kind=release
          elif [[ "$EVENT" == "pull_request" ]]; then kind=pr
          else kind=build; fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" == "pull_request" ]]; then
            files=$(git diff --name-only "$PR_BASE" "$PR_HEAD")
          elif [[ "$EVENT" == "push" && "$REF" == refs/heads/* && -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            files=$(git diff --name-only "$PUSH_BEFORE" "$SHA")
          else
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "Tag or manual run: everything it needs runs"; exit 0
          fi
          echo "Changed files:"; echo "$files"
          code=$(echo "$files" | grep -Ev '(\.md$|^LICENSE$|^\.github/CODEOWNERS$)' | grep -c . || true)
          if [[ "$code" -gt 0 ]]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; echo "Docs only: tests and master.wasm are skipped"; fi

      - id: version
        name: Version (from tests/CMakeLists.txt; a tag must match it)
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^project\(EncoreAudioProcessingTests VERSION ([0-9.]+).*/\1/p' tests/CMakeLists.txt)
          test -n "$version" || { echo "::error::No version found in tests/CMakeLists.txt"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"
          if [[ "$REF" == refs/tags/v* && "v$version" != "$REF_NAME" ]]; then
            echo "::error::Tag $REF_NAME does not match the version in tests/CMakeLists.txt ($version). Change project(EncoreAudioProcessingTests VERSION ...) on main first."
            exit 1
          fi
  tests:
    name: Tests (Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.kind != 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install JUCE's Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfreetype-dev libfontconfig1-dev
      - name: Configure
        run: cmake -S tests -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel "$(nproc)"
      - name: Run
        run: ctest --test-dir build --output-on-failure --parallel "$(nproc)"

  wasm:
    name: master.wasm
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.kind != 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Emscripten ${{ env.EMSCRIPTEN_VERSION }}
        run: |
          git clone --depth 1 --branch "$EMSCRIPTEN_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSCRIPTEN_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSCRIPTEN_VERSION"
      - name: Build
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          em++ --version | head -n 1
          wasm/build.sh
          (cd wasm && sha256sum master.wasm > master.wasm.sha256)
          cat wasm/master.wasm.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: master.wasm
          path: |
            wasm/master.wasm
            wasm/master.wasm.sha256
          if-no-files-found: error

  # The one check to require on main. It fails if any build or test job failed or
  # was cancelled, and passes when they passed or were skipped (docs-only changes).
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, tests, wasm]
    runs-on: ubuntu-24.04
    steps:
      - name: Check the build and test jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            if [[ "$r" == failure || "$r" == cancelled ]]; then echo "::error::A build or test job did not pass"; exit 1; fi
          done

  release:
    name: Release (files from the main build)
    needs: changes
    if: needs.changes.outputs.kind == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Find the main build of this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&head_sha=$SHA&status=success&per_page=50" \
                 --jq '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch") | .id')
          for id in $runs; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100" \
                 --jq '.artifacts[] | select(.expired == false) | .name' | grep -qx master.wasm; then
              echo "run=$id" >> "$GITHUB_OUTPUT"; echo "Using run $id"; exit 0
            fi
          done
          echo "::error::No successful main build with master.wasm for $TAG ($SHA). Releases are not rebuilt. Wait for the main build of this commit to finish (or, if that push only changed docs and skipped the build, run CI by hand on main: Actions, CI, Run workflow), then re-run this job."
          exit 1
      - name: Download its files
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ steps.find.outputs.run }}
        run: gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n master.wasm -D files
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd files
          ls -l
          sha256sum -c master.wasm.sha256
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" master.wasm master.wasm.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" master.wasm master.wasm.sha256 --verify-tag --title "$TAG" \
              --notes "master.wasm built with Emscripten $EMSCRIPTEN_VERSION. SHA-256: $(cut -d' ' -f1 master.wasm.sha256)" \
              --repo "$GITHUB_REPOSITORY"
          fi
